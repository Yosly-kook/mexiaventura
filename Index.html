<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MexiAventura</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pantalla">

        <!-- ========================= -->
        <!-- PANTALLA DE INICIO -->
        <!-- ========================= -->

        <div class="fondo"></div>

        <div class="gradiente-superior"></div>
        <div class="gradiente-inferior"></div>

        <!-- BORDES DECORATIVOS -->

        <div class="borde-superior"></div>
        <div class="borde-inferior"></div>

        <!-- ORNAMENTOS -->

        <div class="ornamento esquina-superior-izquierda">
            ✦◈✦
        </div>

        <div class="ornamento esquina-superior-derecha">
            ✦◈✦
        </div>

        <div class="ornamento esquina-inferior-izquierda">
            ✦◈✦
        </div>

        <div class="ornamento esquina-inferior-derecha">
            ✦◈✦
        </div>


        <!-- BOTONES AUDIO / IDIOMA / SALIR -->

        <div class="botones-menu">

            <button class="boton-menu" id="botonAudio" title="Audio">
                <img src="img/audio.png" alt="Audio">
                <span>AUDIO</span>
            </button>

            <button class="boton-menu" id="botonIdioma" title="Idioma">
                <img src="img/idioma.png" alt="Idioma">
                <span>ES</span>
            </button>

            <button class="boton-menu" id="botonSalir" title="Salir">
                <img src="img/salir.png" alt="Salir">
            </button>

        </div>


        <!-- CONTENIDO DE INICIO -->

        <section class="contenido" id="pantallaInicio">

            <div class="anillo anillo-exterior"></div>
            <div class="anillo anillo-interior"></div>

            <div class="eyebrow">
                ✦ EL ORIGEN DE UN IMPERIO ✦
            </div>

            <h1>
                <span>Mexi</span>
                <span>Aventura</span>
            </h1>

            <div class="divisor">

                <span></span>

                <b>⬡</b>

                <span></span>

            </div>

            <p class="tagline">
                Aztecas, Mayas y Conquistadores
            </p>

            <button id="botonInicio" onclick="iniciarJuego()">
                ⚔ INICIAR JUEGO ⚔
            </button>

        </section>


        <!-- ========================= -->
        <!-- MAPA DE NIVELES -->
        <!-- ========================= -->

        <section id="mapaJuego" class="mapa-juego">

            <!-- TÍTULO DEL MAPA -->

            <div class="titulo">

                <h1>
                    MEXI AVENTURA
                </h1>

                <p>
                    <i>
                        Viaja por la historia de México
                        prehispánico y la Conquista
                    </i>
                </p>

            </div>


            <!-- CAMINITO / NIVELES -->

            <div class="mapa">

                <!-- NIVEL 1 -->

                <button class="nivel nivel1" onclick="abrirNivel(1)">
                    1
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>


                <!-- NIVEL 2 -->

                <button class="nivel nivel2" onclick="abrirNivel(2)">
                    2
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>


                <!-- NIVEL 3 -->

                <button class="nivel nivel3" onclick="abrirNivel(3)">
                    3
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>


                <!-- NIVEL 4 -->

                <button class="nivel nivel4" onclick="abrirNivel(4)">
                    4
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>


                <!-- NIVEL 5 -->

                <button class="nivel nivel5" onclick="abrirNivel(5)">
                    5
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>


                <!-- NIVEL 6 -->

                <button class="nivel nivel6" onclick="abrirNivel(6)">
                    6
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>


                <!-- NIVEL 7 -->

                <button class="nivel nivel7" onclick="abrirNivel(7)">
                    7
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>


                <!-- NIVEL 8 -->

                <button class="nivel nivel8" onclick="abrirNivel(8)">
                    8
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>


                <!-- NIVEL 9 -->

                <button class="nivel nivel9" onclick="abrirNivel(9)">
                    9
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>


                <!-- NIVEL 10 -->

                <button class="nivel nivel10" onclick="abrirNivel(10)">
                    10
                    <span class="estrellas">
                        ⭐⭐⭐
                    </span>
                </button>

            </div>


            <!-- ========================= -->
            <!-- VENTANA DE INFORMACIÓN -->
            <!-- ========================= -->

            <div class="modal" id="modal">

                <div class="contenido-modal">

                    <h2 id="tituloNivel"></h2>

                    <p id="textoNivel"></p>

                    <button class="cerrar" onclick="cerrarNivel()">
                        Cerrar ✖
                    </button>

                </div>

            </div>

        </section>


        <!-- ESCENA DE BIENVENIDA -->

        <div id="escenaBienvenida">

            <h2>
                Bienvenido a MexiAventura
            </h2>

            <p>
                Tu aventura por la Historia de México
                está por comenzar...
            </p>

        </div>


        <!-- DECORACIONES -->

        <div id="decoraciones"></div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
