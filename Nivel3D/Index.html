
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MexiAventura-Pruebas3D</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #18251a;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #interfaz {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.55);
            padding: 15px 20px;
            border-radius: 12px;
            z-index: 10;
        }

        #interfaz h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        #interfaz p {
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- INTERFAZ DEL JUEGO -->
    <div id="interfaz">
        <h1>Nivel 1: Los olmecas</h1>
        <p>Explora la antigua tierra olmeca</p>
        <p>WASD o flechas: Moverte</p>
        <p>Acércate a los objetos para interactuar</p>
    </div>

    <!-- MENSAJE DE INTERACCIÓN -->
    <div id="mensaje">
        Presiona E para interactuar
    </div>

    <!-- DIÁLOGO -->
    <div id="dialogo">
        <p id="textoDialogo"></p>
        <button id="cerrarDialogo">Continuar</button>
    </div>

    <script type="module" src="juego3D.js"></script>

</body>
</html>
