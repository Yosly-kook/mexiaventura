
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MexiAventura - Nivel 1</title>
    <link rel="stylesheet" href="nivelUno.css">
</head>
<body>

    <main class="juego">
        <header class="hud">
            <h1>Nivel 1: El legado olmeca</h1>
            <div id="contadorPiedras">Fragmentos: 0/5</div>
        </header>

        <section class="ventana-juego" id="ventanaJuego">
            <div class="mundo" id="mundo">

                <div id="pablito" class="personaje">
                    <img src="../img/pablito.png" alt="Pablito">
                </div>

                <div class="fragmento" id="piedra1">🪨</div>
                <div class="fragmento" id="piedra2">🪨</div>
                <div class="fragmento" id="piedra3">🪨</div>
                <div class="fragmento" id="piedra4">🪨</div>
                <div class="fragmento" id="piedra5">🪨</div>

                <div class="indicacion">
                    Explora el lugar y reúne los cinco fragmentos.
                </div>

            </div>
        </section>

        <p class="instrucciones">
            Utiliza las flechas del teclado para mover a Pablito.
        </p>

        <div id="mensajeVictoria" class="mensaje-victoria" hidden>
            <h2>¡Lo lograste!</h2>
            <p>Has reunido todos los fragmentos de piedra.</p>
            <p>¡La cabeza colosal está lista para reconstruirse!</p>
        </div>
    </main>

    <script src="nivelUno.js"></script>
</body>
</html>
